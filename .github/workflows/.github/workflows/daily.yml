
name: Daily Shorts Script

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run script
        run: python shorts_animation.py
        
